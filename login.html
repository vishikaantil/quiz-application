<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Quizify</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">⚡ Quizify</a>
        </div>
    </nav>

    <main class="main-container">
        <div class="auth-card">
            <h2 style="text-align: center; margin-bottom: 1.5rem;">Welcome Back</h2>
            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="user@example.com">
                    <span class="error-msg" id="emailError"></span>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                    <span class="error-msg" id="passwordError"></span>
                </div>
                <div class="form-extra">
                    <label><input type="checkbox"> Remember me</label>
                    <a href="#" style="color: var(--primary-color);">Forgot Password?</a>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
            </form>
            <p style="text-align: center; margin-top: 1rem; color: var(--text-secondary);">
                Don't have an account? <a href="register.html" style="color: var(--primary-color);">Register</a>
            </p>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
